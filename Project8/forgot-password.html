<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Courses Directory</title>
    <link rel="stylesheet" href="./Login-style.css">
    <script src="./forgot-password.js" defer></script>
</head>
<body>
    <main class="login-card">
        <a href="index.html" class="brand">Centralized Accredited University and College Platform</a>
        <h2>Forgot Password</h2>
        <h3>We'll email you a reset link</h3>

        <form id="forgotForm" class="login-form" novalidate>
            <input type="email" id="email" name="email"
                   placeholder="Email address" aria-label="Email address"
                   autocomplete="email" maxlength="254" required>

            <button type="submit" id="forgotButton">Send Reset Link</button>

            <p><a href="./Login%20Page.html">Back to login</a></p>

            <p id="forgotMessage" role="status" aria-live="polite" hidden></p>
        </form>
    </main>
</body>
</html>
