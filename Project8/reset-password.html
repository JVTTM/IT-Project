<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Courses Directory</title>
    <link rel="stylesheet" href="./Login-style.css">
    <script src="./reset-password.js" defer></script>
</head>
<body>
    <main class="login-card">
        <a href="index.html" class="brand">Centralized Accredited University and College Platform</a>
        <h2>Reset Password</h2>
        <h3>Choose a new password</h3>

        <form id="resetForm" class="login-form" novalidate>
            <input type="password" id="password" placeholder="New password"
                   aria-label="New password" autocomplete="new-password"
                   minlength="8" required>
            <input type="password" id="confirm" placeholder="Confirm new password"
                   aria-label="Confirm new password" autocomplete="new-password" required>
            <small>At least 8 characters, with uppercase, lowercase and a number.</small>

            <button type="submit" id="resetButton">Update Password</button>

            <p><a href="./Login%20Page.html">Back to login</a></p>
            <p id="resetMessage" role="status" aria-live="polite" hidden></p>
        </form>
    </main>
</body>
</html>
